# rom-hamster 模拟器启动命令（出厂默认）
#
# 格式：平台ID: 命令模板
#   %ROM% = 选中 ROM 的绝对路径（多碟优先 .m3u）
#   %DIR% = 游戏目录
# 兼容旧写法 {file} / {dir}。
#
# 本文件出厂不写真实路径；按发行版/模拟器实际安装位置取消注释。
# 用户覆盖层：~/.config/rom-hamster/emulators.conf
# 系统覆盖层：/etc/rom-hamster/emulators.conf
#
# 示例（RetroArch 核心路径需按本机实际位置修改）：
# nes: retroarch -L /usr/lib/x86_64-linux-gnu/libretro/nestopia_libretro.so "%ROM%"
# snes: retroarch -L /usr/lib/x86_64-linux-gnu/libretro/snes9x_libretro.so "%ROM%"
# gba: retroarch -L /usr/lib/x86_64-linux-gnu/libretro/mgba_libretro.so "%ROM%"
# psx: retroarch -L /usr/lib/x86_64-linux-gnu/libretro/mednafen_psx_libretro.so "%ROM%"
#
# 也可以使用独立模拟器，例如：
# nes: fceux "%ROM%"
# gba: mgba-qt "%ROM%"
