# =============================================================================
# EmulationStation（RetroPie / 原版 ES）前端规格
# =============================================================================
# 与 ES-DE 的差别（这是必须分成两份规格文件的原因）：
#   1. 原版 ES **会读** <image>/<thumbnail>/<marquee>/<video>/<fanart> 标签，
#      媒体放在 ROM 目录下的 media/，命名用后缀约定：
#        <游戏名>-image.<ext>   封面
#        <游戏名>-thumb.<ext>   缩略图（截图）
#        <游戏名>-marquee.<ext> 跑马灯
#        <游戏名>-video.<ext>   视频
#        <游戏名>-fanart.<ext>  同人图
#      ES-DE 则完全不吃这些标签（见 es-de.conf 的说明）。
#   2. 原版 ES 的 <path> 可以不带 "./"，ES-DE 必须带；本模板统一带 "./"，
#      两边都能读。
#   3. <releasedate> 同为 YYYYMMDDT000000；<rating> 同为 0.0–1.0。
# =============================================================================

[frontend]
id           = es
name         = EmulationStation
spec_version = 1
escape       = xml
layout_rom   = %platform%/%rom_file%
manifest     = %platform%/gamelist.xml
media_dir    = %platform%/media

[export.header]
<?xml version="1.0" encoding="UTF-8"?>
<gameList>

[export.game]
  <game>
    <path>./%rom_file:xml%</path>
    <name>%name:xml%</name>
%if:description%    <desc>%description:xml%</desc>
%endif%%if:rating_norm%    <rating>%rating_norm%</rating>
%endif%%if:releasedate_es%    <releasedate>%releasedate_es%</releasedate>
%endif%%if:developer%    <developer>%developer:xml%</developer>
%endif%%if:publisher%    <publisher>%publisher:xml%</publisher>
%endif%%if:genre%    <genre>%genre:xml%</genre>
%endif%%if:players%    <players>%players:xml%</players>
%endif%%if:cover_rel%    <image>./%cover_rel:xml%</image>
%endif%%if:screenshot_rel%    <thumbnail>./%screenshot_rel:xml%</thumbnail>
%endif%%if:marquee_rel%    <marquee>./%marquee_rel:xml%</marquee>
%endif%%if:video_rel%    <video>./%video_rel:xml%</video>
%endif%  </game>

[export.footer]
</gameList>

# 媒体落位：全部进 <platform>/media/，靠文件名后缀区分类型。
[export.media]
covers      = %media_dir%/%game_name%-image
screenshots = %media_dir%/%game_name%-thumb
videos      = %media_dir%/%game_name%-video
marquees    = %media_dir%/%game_name%-marquee
miximages   = %media_dir%/%game_name%-fanart

[import]
file              = %platform%/gamelist.xml
format            = xml
record            = /gameList/game
field.name        = ./name
field.description = ./desc
field.rating      = ./rating
field.releasedate = ./releasedate
field.developer   = ./developer
field.publisher   = ./publisher
field.genre       = ./genre
field.players     = ./players
field.rom         = ./path
field.cover       = ./image
field.screenshot  = ./thumbnail
field.marquee     = ./marquee
field.video       = ./video
