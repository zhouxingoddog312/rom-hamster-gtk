# =============================================================================
# Pegasus 前端规格
# =============================================================================
# 核对来源（2026-11-11）：
#   - Pegasus 官方仓库 src/backend/providers/pegasus_metadata/PegasusMetadata.cpp
#     （字段与 assets.* 键的解析实现）
#   - src/backend/model/gaming/Assets.h（资产键的规范名清单）
#   - tests/backend/providers/pegasus/data/ 下官方测试样例（真实语法）
#
# 关键结论：
#   1. 记录以 `game:` 开头，记录内每行 `键: 值`；记录之间用空行分隔。
#      一条记录的结束由下一个 `game:` 或文件结尾决定（1.0.0 的解析器要求
#      空行收尾，导致最后一条静默丢失——本版按 EOF 收尾）。
#   2. 资产键的规范名来自 Assets.h 的 GEN() 清单，注意是 titlescreen
#      （全小写），不是 titleScreen。可用键：
#        boxFront boxBack boxSpine boxFull cartridge logo poster marquee
#        bezel panel cabinetLeft cabinetRight tile banner steam
#        background music screenshot titlescreen video
#   3. 多行值靠"续行缩进"表达；本实现把描述压成单行输出（description_line），
#      避免缩进推断出错；多行能力留给将来。
#   4. rating 同为 0.0–1.0，用 rating_norm。
#   5. `launch:` 支持 `{file.path}` 占位符，可直接在 collection/game 级给出。
# =============================================================================

[frontend]
id           = pegasus
name         = Pegasus
spec_version = 1
escape       = text
layout_rom   = %platform%/%rom_file%
manifest     = %platform%/metadata.pegasus.txt
media_dir    = %platform%/media

[export.header]
collection: %platform_export_name%
launch: %emulator_launch%
extensions: %platform_extensions%

[export.game]
game: %name%
file: %rom_file%
%if:description_line%summary: %description_line%
%endif%%if:developer%developer: %developer%
%endif%%if:publisher%publisher: %publisher%
%endif%%if:genre%genre: %genre%
%endif%%if:players%players: %players%
%endif%%if:rating_norm%rating: %rating_norm%
%endif%%if:year%release: %year%
%endif%%if:tags%tags: %tags%
%endif%%if:cover_rel%assets.boxFront: %cover_rel%
%endif%%if:screenshot_rel%assets.screenshot: %screenshot_rel%
%endif%%if:marquee_rel%assets.marquee: %marquee_rel%
%endif%%if:video_rel%assets.video: %video_rel%
%endif%%if:miximage_rel%assets.background: %miximage_rel%
%endif%

[export.footer]
# end of metadata.pegasus.txt

# 媒体落位：与 metadata.pegasus.txt 同目录的 media/，靠 assets.* 显式指路。
[export.media]
covers      = %media_dir%/boxfront/%game_name%
screenshots = %media_dir%/screenshot/%game_name%
videos      = %media_dir%/video/%game_name%
marquees    = %media_dir%/marquee/%game_name%
miximages   = %media_dir%/background/%game_name%

[import]
file              = %platform%/metadata.pegasus.txt
format            = lines
record            = game:
field.name        = name
field.rom         = file
field.description = summary
field.developer   = developer
field.publisher   = publisher
field.genre       = genre
field.players     = players
field.rating      = rating
field.year        = release
field.cover       = assets.boxFront
field.screenshot  = assets.screenshot
field.marquee     = assets.marquee
field.video       = assets.video
