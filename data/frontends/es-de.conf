# =============================================================================
# ES-DE（EmulationStation-DE）前端规格
# =============================================================================
# 核对来源（2026-11-11）：
#   - es-de 官方仓库 USERGUIDE.md
#   - es-app/src/MetaData.cpp      （gamelist.xml 字段声明）
#   - es-app/src/GamelistFileParser.cpp（解析实现）
#   - resources/systems/unix/es_systems.xml（平台名与扩展名）
#
# 三条关键结论（照 1.0.0 的做法会出错）：
#   1. ES-DE 的 gamelist.xml 只承载元数据。GamelistFileParser.cpp 全文没有
#      image / marquee / video / thumbnail / fanart 这些标签，媒体由 ES-DE 按
#      "文件名匹配"从 ~/ES-DE/downloaded_media/<system>/<type>/ 取。
#      所以本模板**不输出** <image> 等标签——写了也不生效，只会让用户以为导出
#      坏了。媒体仍会导出，位置见 [export.media]。
#   2. <releasedate> 的格式是 YYYYMMDDT000000（MetaData.cpp 的默认值
#      19700101T000000 即此格式），1.0.0 的 "1999" 年份不能直接写进去。
#   3. <rating> 取值 0.0–1.0；本库内部是 10 分制，故用 rating_norm（由代码换算）。
#   4. <path> 必须带 "./" 前缀，否则 ES-DE 不认（USERGUIDE 明确要求）。
# =============================================================================

[frontend]
id           = esde
name         = EmulationStation-DE
spec_version = 1
escape       = xml
layout_rom   = ROMs/%platform%/%rom_file%
manifest     = gamelists/%platform%/gamelist.xml
media_dir    = downloaded_media/%platform%

[export.header]
<?xml version="1.0" encoding="UTF-8"?>
<gameList>

[export.game]
  <game>
    <path>./%rom_file:xml%</path>
    <name>%name:xml%</name>
%if:description%    <desc>%description:xml%</desc>
%endif%%if:rating_norm%    <rating>%rating_norm%</rating>
%endif%%if:releasedate_es%    <releasedate>%releasedate_es%</releasedate>
%endif%%if:developer%    <developer>%developer:xml%</developer>
%endif%%if:publisher%    <publisher>%publisher:xml%</publisher>
%endif%%if:genre%    <genre>%genre:xml%</genre>
%endif%%if:players%    <players>%players:xml%</players>
%endif%  </game>

[export.footer]
</gameList>

# 媒体落位（代码按此目录 + 游戏名复制，扩展名沿用源文件）：
#   downloaded_media/<platform>/covers/<游戏名>.<ext>
#   downloaded_media/<platform>/screenshots/<游戏名>.<ext>
#   downloaded_media/<platform>/videos/<游戏名>.<ext>
#   downloaded_media/<platform>/marquees/<游戏名>.<ext>
#   downloaded_media/<platform>/miximages/<游戏名>.<ext>
# 用户把整个导出目录移动到 ~/ES-DE/ 下即可被识别。
[export.media]
covers      = %media_dir%/covers/%game_name%
screenshots = %media_dir%/screenshots/%game_name%
videos      = %media_dir%/videos/%game_name%
marquees    = %media_dir%/marquees/%game_name%
miximages   = %media_dir%/miximages/%game_name%

[import]
file              = %platform%/gamelist.xml
format            = xml
record            = /gameList/game
field.name        = ./name
field.description = ./desc
field.rating      = ./rating
field.releasedate = ./releasedate
field.developer   = ./developer
field.publisher   = ./publisher
field.genre       = ./genre
field.players     = ./players
field.rom         = ./path
