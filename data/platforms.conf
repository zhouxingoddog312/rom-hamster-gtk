# =============================================================================
# rom-hamster 内置平台规则库（出厂默认，只读）
# =============================================================================
# 安装位置：/usr/share/rom-hamster/platforms.conf（data 包）
# 覆盖顺序：内置默认 → /usr/share → /etc/rom-hamster/platforms.conf
#           → ~/.config/rom-hamster/platforms.conf（详见 ARCHITECTURE.md §10.2）
#
# 本文件的平台扩展名清单已对照以下一手来源核对（2026-11-11）：
#   1. ES-DE 官方系统定义 resources/systems/unix/es_systems.xml（195 个系统，
#      含每个系统的扩展名集合）
#   2. Pegasus 官方仓库的元数据样例与解析器源码
#   3. EmulationStation（RetroPie）与 ES-DE 的 gamelist.xml 字段声明
#
# 核对政策（重要）：
#   ES-DE 的扩展名清单是"为容错而超集"的——它把 .zip/.7z 等归档格式、.m3u 播放
#   列表、以及大量跨平台扩展（如给 gb 也列出 .sfc/.smc）都列进了系统扩展名，
#   因为它自己负责启动模拟器，多认几个扩展只是多一次尝试。
#   本项目不照搬这部分，原因：
#     - 归档格式由 [archive_extensions] 单独识别，混进平台扩展会让"压缩包分流"
#       与"平台判定"互相污染；
#     - 跨平台容错扩展会让二义判定彻底失效（每个 .bin/.rom 都能命中十几个平台，
#       弹窗会淹没用户）。
#   因此本清单只保留**该平台真实存在**的映像格式，以及确有实物证据的同族变体。
#   被刻意剔除的项在此注明，便于将来复核。
#
# -----------------------------------------------------------------------------
# [platform_extensions] 段：每个平台一行，格式：
#
#   平台ID:后缀列表;compress_supported=布尔;recommended_format=格式;arcade=布尔;patch_formats=补丁后缀;ambiguous_formats=二义后缀;aliases=别名列表
#
# 字段说明：
#   平台ID           内部规范名，小写字母数字连字符；ES/ES-DE 目录名同名
#   后缀列表         ROM 文件后缀，分号分隔
#   compress_supported  该平台 ROM 是否支持压缩后直读（卡带类 true，光盘类 false）
#   recommended_format  推荐存储格式：zip / 7z / chd / cso / wbfs / raw
#   arcade           是否街机基板（true 时 ZIP 直存、多文件哈希匹配）
#   patch_formats    该平台专属补丁/DLC 后缀
#   ambiguous_formats 二义性格式（既可能是本体也可能是补丁），导入时确认
#   aliases          目录名别名，逗号分隔；整库导入时反查平台 ID
#
# 本次相对 1.0.0 的修正（逐条，均有一手依据）：
#   pcengine   删 .tg16 —— TG16 是主机名不是扩展名
#   videopac   删 .jpg  —— 图片不是 ROM；此条正是 1.0.0 ".jpg 被当 ROM"缺陷的源头
#   gamegear / mastersystem  删 .zip —— 归档由 archive 层识别，不该混入平台
#   atari800   去重 .atr，补 .car/.cas/.cdm/.com/.atx/.rom/.bin/.xfd
#   bbcmicro   去重 .ssd，补 .img
#   megaduck   原 .md 与 megadrive 冲突，改为真实格式 .bin
#   c16        aliases 去掉 plus4（Plus/4 是独立机型，见下方 plus4 行）
#   gameandwatch  补 .mgw（ES-DE 认定格式）
#   nes/fds/snes/gb 系  补 .unif/.swc/.bs/.bml/.st/.bsx/.gd3 等真实变体
#   各光盘平台  补 .chd/.mds/.toc/.ciso 等实际在用的映像格式
# =============================================================================

