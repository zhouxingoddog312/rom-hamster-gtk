name: CI

# Gitee 是主仓库，这个工作流跑在 GitHub 镜像上：push 到 master 或发起 PR 都会触发。
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  matrix:
    name: ${{ matrix.distro }} / ${{ matrix.config }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.distro }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # ARCHITECTURE §8.4 的三组构建；发行版按 §14 的 M5 验收口径。
        distro: ["ubuntu:24.04", "debian:13"]
        config: [gui, nogui, asan]
    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config gettext python3 \
            libglib2.0-dev libsqlite3-dev libarchive-dev libxml2-dev zlib1g-dev \
            libgtk-4-dev xvfb xauth x11-utils fonts-dejavu-core

      - name: Run ${{ matrix.config }} leg
        run: bash tools/ci-matrix.sh ${{ matrix.config }}

  package:
    name: ${{ matrix.distro }} / package
    runs-on: ubuntu-24.04
    container: ${{ matrix.distro }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        distro: ["ubuntu:24.04", "debian:13"]
    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Install packaging dependencies
        run: |
          apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev lintian meson ninja-build \
            pkg-config gettext libglib2.0-dev libsqlite3-dev libarchive-dev \
            libxml2-dev zlib1g-dev libgtk-4-dev

      - name: Build packages
        run: bash tools/m4-close-deb.sh

      - name: Lint packages
        run: |
          cd "$HOME/.cache/romham-m4/close-stage"
          lintian rom-hamster_*.deb rom-hamster-gui_*.deb rom-hamster-data_*.deb

      - name: Install packages
        run: |
          cd "$HOME/.cache/romham-m4/close-stage"
          install_one() {
            if out=$(dpkg -i "$1" 2>&1); then
              printf '%s\n' "$out"
              return 0
            fi
            printf '%s\n' "$out"
            echo "::error::dpkg -i $1 failed: $(printf '%s' "$out" | tr '\n' '|' | cut -c1-900)"
            return 1
          }
          install_one rom-hamster-data_*.deb
          install_one rom-hamster_*.deb
          install_one rom-hamster-gui_*.deb

      - name: Verify installed binary and catalog
        run: |
          rom-hamster --version || { echo "::error::rom-hamster --version failed"; exit 1; }
          if test -f /usr/share/locale/zh_CN/LC_MESSAGES/rom-hamster.mo; then
            echo "zh_CN catalog present"
            exit 0
          fi
          # 日志需 admin 才能下载，这里把判定所需的证据逐段打印成注解。
          deb=$(ls "$HOME"/.cache/romham-m4/close-stage/rom-hamster_*.deb | head -1)
          {
            echo "== dpkg -L rom-hamster (locale/mo) =="
            dpkg -L rom-hamster 2>&1 | grep -iE 'locale|\.mo' || echo "(none)"
            echo "== dpkg-deb -c $(basename "$deb") (locale/mo) =="
            dpkg-deb -c "$deb" 2>&1 | grep -iE 'locale|\.mo' || echo "(none)"
            echo "== ls /usr/share/locale/zh_CN/LC_MESSAGES =="
            ls -l /usr/share/locale/zh_CN/LC_MESSAGES 2>&1 || echo "(missing)"
            echo "== dpkg excludes =="
            cat /etc/dpkg/dpkg.cfg.d/* 2>/dev/null || echo "(none)"
          } > /tmp/rh-diag.txt
          cat /tmp/rh-diag.txt
          echo "::error::zh_CN catalog missing: $(tr '\n' '|' < /tmp/rh-diag.txt | cut -c1-900)"
          exit 1

      - name: Purge packages
        run: |
          if ! out=$(dpkg -P rom-hamster-gui rom-hamster rom-hamster-data 2>&1); then
            printf '%s\n' "$out"
            echo "::error::dpkg -P failed: $(printf '%s' "$out" | tr '\n' '|' | cut -c1-900)"
            exit 1
          fi
          printf '%s\n' "$out"
          if dpkg -s rom-hamster >/dev/null 2>&1; then
            echo "::error::rom-hamster still registered after purge"
            exit 1
          fi
