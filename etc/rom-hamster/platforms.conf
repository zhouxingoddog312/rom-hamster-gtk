# =============================================================================
# rom-hamster 平台规则（系统覆盖层，conffile）
# =============================================================================
# 出厂规则在 /usr/share/rom-hamster/platforms.conf（只读，升级时被覆盖）。
# 本文件用于系统管理员增补或改写平台规则，优先级高于出厂规则、低于用户层
# (~/.config/rom-hamster/platforms.conf)。
#
# 格式与出厂文件完全一致，按"平台 ID"整条覆盖：本文件里出现的平台会替换掉
# 出厂层里同名平台的整条定义（扩展名、补丁、二义、别名全部以本文件为准），
# 不会叠加。五段的写法见 /usr/share/rom-hamster/platforms.conf 文件头。
#
# 示例：给 nes 平台补一个自制扩展名
#
#   [platform_extensions]
#   nes:.nes;.unf;.unif;.hdr;compress_supported=true;recommended_format=zip;arcade=false;patch_formats=.ips;.bps;ambiguous_formats=;aliases=nintendo,nes,famicom
#
# 本文件默认不含任何条目，表示"系统层不覆盖出厂规则"。
# =============================================================================
