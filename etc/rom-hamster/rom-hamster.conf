# =============================================================================
# rom-hamster 系统配置（conffile）
# =============================================================================
# 本文件是"系统管理员覆盖层"，位于配置优先级第 4 层：
#   内置默认 → /usr/share/rom-hamster/rom-hamster.conf（出厂，只读）
#            → /etc/rom-hamster/rom-hamster.conf（本文件）
#            → ~/.config/rom-hamster/rom-hamster.conf
#            → 命令行
#
# 全部键都可以留空/注释；留空即沿用内置默认。查看某个键当前取值与来源：
#     rom-hamster config --explain ROM_ROOT
#
# 注意：升级时 dpkg 会保留管理员对本文件的修改（conffile 语义）。
# =============================================================================

[default]

# ROM 库根目录。留空时由首次运行向导或 GUI 指定。
#ROM_ROOT = /srv/roms

# DAT 目录（Logiqx XML）
#dat_dir = /srv/roms/dats

# 归档后缀：导入时被识别为压缩包（不是 ROM 本体）
#archive_extensions = .zip;.7z;.rar

# 导出压缩格式
#archive_compress_export_format = zip

# 孤立媒体归属的相似度阈值（0–100）
#duplicate_check_threshold = 70

# DAT 匹配用哪个哈希：crc32 / md5 / sha1
#dat_match_hash = crc32

# 多碟 DAT 是否自动合并
#dat_auto_match_multi_disc = true

# 多碟时是否生成 .m3u
#auto_generate_m3u = true

# 导出时是否包含被隐藏的碟片
#export_hidden_discs = true

# 自动生成的碟片标签前缀
#disc_label_prefix = Disc

# 导入成功后是否删除源文件（默认关）
#auto_delete_source = false

# 库文件路径。留空 = <ROM_ROOT>/romhamster.db
#store_path =

# 前端规格 `launch` 字段的命令模板；本程序不启动模拟器
#emulator_launch =

# 界面语言（BCP-47，例如 zh_CN）；留空 = 跟随系统
#lang =
